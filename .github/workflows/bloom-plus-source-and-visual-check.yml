name: Luna Plus public APK visual check
on:
  push:
    branches: [block-bloom-luna-method]
    paths: ['.github/workflows/bloom-plus-source-and-visual-check.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download the published APK and check its exact bytes
        run: |
          mkdir -p evidence
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          curl -fsSL 'https://github.com/icemusike/codex-tests/releases/download/block-bloom-luna-plus-v2.0/Block-Bloom-Luna-Plus-2.0.apk' -o game.apk
          echo '43b32a29866b071b6dbc5b170f133f820bd3058d686d65e9f92b049b759d230a  game.apk' | sha256sum -c -
          python -m pip install --quiet pillow
      - name: Boot Android 16 and wait for initial setup to settle
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64' >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n visual -p "$ANDROID_AVD_HOME/visual.avd" -k 'system-images;android-36;google_apis;x86_64' --device 'pixel_tablet'
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$ANDROID_AVD_HOME/visual.avd" > "$ANDROID_AVD_HOME/visual.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd visual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 4 > evidence/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell wm density 160
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install game.apk | tee evidence/install.txt
          sleep 30
      - name: Capture responsive cold launches in both screen layouts
        run: |
          set -euo pipefail
          for orientation in portrait landscape; do
            adb shell am force-stop ro.blockbloom.lunaplus
            if [ "$orientation" = landscape ]; then adb shell wm size 1280x800; else adb shell wm size 800x1280; fi
            sleep 15
            adb logcat -c
            adb shell am start -W -n ro.blockbloom.lunaplus/.MainActivity > "evidence/$orientation-start.txt"
            sleep 20
            adb shell pidof ro.blockbloom.lunaplus
            adb exec-out screencap -p > "evidence/$orientation.png"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "evidence/$orientation.xml" >/dev/null
            adb logcat -d > "evidence/$orientation-logcat.txt"
            ! grep -q 'ANR in ro.blockbloom.lunaplus' "evidence/$orientation-logcat.txt"
            python3 - "$orientation" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys
          name=sys.argv[1]
          im=Image.open('evidence/'+name+'.png').convert('RGB')
          content=im.crop((20,80,im.width-20,im.height-80))
          colors=content.getcolors(content.width*content.height)
          assert colors and len(colors)>300, f'{name} is not rendered'
          assert max(n for n,c in colors)/(content.width*content.height)<.96
          xml=Path('evidence/'+name+'.xml').read_text()
          assert 'ro.blockbloom.lunaplus' in xml and 'android.webkit.WebView' in xml
          assert "isn't responding" not in xml
          result=f'PASS public APK launch and visible {name} frame; {len(colors)} colors'
          Path('evidence/'+name+'-result.txt').write_text(result+'\n')
          print(result)
          PY
          done
          adb logcat -d -b crash > evidence/crash.txt
          ! grep -q 'Process: ro.blockbloom.lunaplus' evidence/crash.txt
      - name: Collect actual runtime diagnostics
        if: always()
        run: |
          adb logcat -d -b crash > evidence/crash.txt || true
          adb shell dumpsys activity lastanr > evidence/lastanr.txt || true
          adb shell dumpsys cpuinfo > evidence/cpuinfo.txt || true
          adb shell dumpsys dropbox --print data_app_anr > evidence/anr-details.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Block-Bloom-Luna-Plus-Public-APK-Visual-Check
          path: evidence/
          retention-days: 30
