name: Luna Plus source archive and public APK visual check
on:
  push:
    branches: [block-bloom-luna-method]
    paths: ['.github/workflows/bloom-plus-source-and-visual-check.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified source with no signing credentials
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,zipfile,hashlib
          root='https://api.firestorage.ai/dev/file/shares/xcKEiRCuEtty'
          f=json.load(urllib.request.urlopen(root+'/files?maxResults=1000',timeout=40))['files'][0]
          m=json.load(urllib.request.urlopen(urllib.request.Request(root+'/files/'+f['fileId']+'/download',method='POST'),timeout=40))
          data=urllib.request.urlopen(m['downloadUrl'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='d50bb249e50e0e604a3cf1f461e1ba9a0c97f910da6635ef84c34d4990bafa7c'
          target=pathlib.Path('Block-Bloom-Luna-Plus-2.0-Source.zip'); target.write_bytes(data)
          with zipfile.ZipFile(target) as z:
              for name in z.namelist():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not any(x in name.lower() for x in ['private','password','.p12','.jks','.pem','sdk35','.ttf','.otf'])
              z.extractall('block-bloom-luna-plus')
          PY
      - name: Keep source under version control and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Block Bloom Build'
          git config user.email 'bloom-build@users.noreply.github.com'
          git add block-bloom-luna-plus
          git commit -m 'Archive Luna+ 2.0 source and regression tests; exclude signing keys'
          git push origin HEAD:block-bloom-luna-method
          gh release upload block-bloom-luna-plus-v2.0 Block-Bloom-Luna-Plus-2.0-Source.zip --repo "$GITHUB_REPOSITORY" --clobber
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download the already-published game APK
        run: |
          mkdir -p evidence
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          curl -fsSL 'https://github.com/icemusike/codex-tests/releases/download/block-bloom-luna-plus-v2.0/Block-Bloom-Luna-Plus-2.0.apk' -o game.apk
          echo '43b32a29866b071b6dbc5b170f133f820bd3058d686d65e9f92b049b759d230a  game.apk' | sha256sum -c -
          python -m pip install --quiet pillow
      - name: Boot Android 16 without the instrumentation APK
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64' >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n visual -p "$ANDROID_AVD_HOME/visual.avd" -k 'system-images;android-36;google_apis;x86_64' --device 'pixel_tablet'
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$ANDROID_AVD_HOME/visual.avd" > "$ANDROID_AVD_HOME/visual.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd visual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > evidence/emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell wm size 800x1280
          adb shell wm density 160
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install game.apk | tee evidence/install.txt
      - name: Verify rendered public APK in portrait and landscape
        run: |
          set -euo pipefail
          for orientation in portrait landscape; do
            adb shell am force-stop ro.blockbloom.lunaplus
            if [ "$orientation" = landscape ]; then adb shell wm size 1280x800; fi
            adb logcat -c
            adb shell am start -W -n ro.blockbloom.lunaplus/.MainActivity > "evidence/$orientation-start.txt"
            sleep 25
            adb shell pidof ro.blockbloom.lunaplus
            adb exec-out screencap -p > "evidence/$orientation.png"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "evidence/$orientation.xml" >/dev/null
            adb logcat -d > "evidence/$orientation-logcat.txt"
            python3 - "$orientation" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys
          name=sys.argv[1]
          im=Image.open('evidence/'+name+'.png').convert('RGB')
          content=im.crop((20,80,im.width-20,im.height-80))
          colors=content.getcolors(content.width*content.height)
          assert colors and len(colors)>300, f'{name} not visibly rendered: {len(colors or [])} colors'
          assert max(n for n,c in colors)/(content.width*content.height)<.96, f'{name} is mostly a solid frame'
          xml=Path('evidence/'+name+'.xml').read_text()
          assert 'ro.blockbloom.lunaplus' in xml and ('Cozy' in xml or 'COZY' in xml or 'Prism' in xml), 'Home game controls not visible'
          print('PASS published APK visible',name,'colors',len(colors))
          PY
          done
      - name: Collect crash information
        if: always()
        run: |
          adb logcat -d -b crash > evidence/crash.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Block-Bloom-Luna-Plus-Public-APK-Visual-Check
          path: evidence/
          retention-days: 30
