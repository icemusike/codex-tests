name: Build Luna KeyQuest review
on:
  push:
    branches: [main]
    paths:
      - 'luna-keyquest/game.bundle'
      - 'luna-keyquest/build-project.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: luna-keyquest-review
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize the reviewed source and app resources
        run: |
          python -m pip install --quiet cairosvg
          python -c "from pathlib import Path; import json; p=Path('luna-keyquest/game.bundle'); b=json.loads(p.read_text()); b['gzip_base64']=''.join((p.parent / f).read_text().strip() for f in b.pop('parts')); p.write_text(json.dumps(b))"
          python luna-keyquest/build-project.py
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Compile, align, and sign a review APK
        working-directory: luna-dist
        run: bash android/build.sh
      - name: Publish the standalone browser review on an isolated branch
        run: |
          set -euo pipefail
          gh auth setup-git
          cd luna-dist/web
          git init -q
          git config user.name "Luna KeyQuest Build"
          git config user.email "luna-build@users.noreply.github.com"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q origin luna-keyquest-review; then
            git reset --soft FETCH_HEAD
          fi
          git add .
          git commit -q -m "Publish Luna KeyQuest review from ${GITHUB_SHA:0:7}" || true
          git push origin HEAD:refs/heads/luna-keyquest-review
      - name: Package source and create a downloadable Android release
        run: |
          set -euo pipefail
          cd luna-dist
          zip -q -r Luna-KeyQuest-Source.zip web android README.txt -x 'android/build/*' 'web/.git/*'
          TAG="luna-review-${GITHUB_RUN_NUMBER}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Luna KeyQuest review build ${GITHUB_RUN_NUMBER}" --notes "Review build for family testing. Includes an offline Android APK and full HTML/Java source. No account, ads, analytics, or Android network permission. This is a sideloaded review APK, not a Play Store release. A fresh test signing key is used on each build, so a later review APK may require uninstalling the previous build, which removes its local progress. Android 8+ with an up-to-date Android System WebView is required. The APK signature is checked during the build; physical-device testing is still needed."
          gh release upload "$TAG" android/build/Luna-KeyQuest.apk Luna-KeyQuest-Source.zip --repo "$GITHUB_REPOSITORY" --clobber
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luna-KeyQuest-Android-and-Source
          path: |
            luna-dist/android/build/Luna-KeyQuest.apk
            luna-dist/Luna-KeyQuest-Source.zip
          retention-days: 30
