name: Luna KeyQuest - live preview verification
on:
  push:
    branches: [luna-keyquest-preview]
    paths: ['.github/workflows/luna-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public website and actual Android package
        run: |
          mkdir -p /tmp/live-results
          curl --fail --retry 5 --retry-delay 3 https://luna-keyquest1.netlify.app/ -o /tmp/live-results/index.html
          grep -q 'window.LunaApp' /tmp/live-results/index.html
          curl --fail --retry 5 --retry-delay 3 https://luna-keyquest1.netlify.app/Luna-KeyQuest-v1.apk -o /tmp/live-results/Luna-KeyQuest-v1.apk
          echo '3a0404230d0f539f94da245987086fd90d3178d452f360a224e9d5870d4593a3  /tmp/live-results/Luna-KeyQuest-v1.apk' | sha256sum --check
      - name: Verify mobile touch play and offline reload on the live site
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            c=b.new_context(viewport={'width':1280,'height':800},has_touch=True)
            page=c.new_page();errors=[]
            page.on('pageerror',lambda error: errors.append(str(error)))
            response=page.goto('https://luna-keyquest1.netlify.app/',wait_until='networkidle')
            assert response.status==200
            page.screenshot(path='/tmp/live-results/live-tablet.png')
            page.click('#start-button');page.click('[data-action="tutorial-start"]');page.wait_for_timeout(250)
            page.locator('.key[data-key="A"]').tap();assert page.evaluate('Game.score')==10
            page.set_viewport_size({'width':390,'height':844});page.wait_for_timeout(250)
            assert page.evaluate('document.documentElement.scrollWidth')==390
            page.screenshot(path='/tmp/live-results/live-mobile.png')
            page.evaluate('Game.finish()');page.click('[data-action="go-home"]')
            page.wait_for_function('navigator.serviceWorker.controller !== null',timeout=15000)
            c.set_offline(True);page.reload(wait_until='domcontentloaded')
            assert page.locator('#start-button').is_visible()
            assert page.evaluate('data.totalHits')==1
            page.click('#start-button');page.wait_for_timeout(250);page.keyboard.press('a');assert page.evaluate('Game.score')==10
            assert not errors,errors
            result={'url':'https://luna-keyquest1.netlify.app/','http_status':200,'touch_scoring':True,'portrait_layout':True,'saved_progress':True,'offline_play':True,'javascript_errors':errors,'apk_sha256':'3a0404230d0f539f94da245987086fd90d3178d452f360a224e9d5870d4593a3'}
            Path('/tmp/live-results/verification.json').write_text(json.dumps(result,indent=2))
            print(json.dumps(result))
            b.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Live-Verification
          path: /tmp/live-results
          retention-days: 30
